# Render Blueprint for the website: Dashboard > New > Blueprint, then pick this repo.
services:
  - type: web
    name: kaasupathayam-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass # wait for GitHub Actions CI to go green
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      # Single-page app: let the client router handle deep links like /transactions.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL # https://kaasupathayam-api.onrender.com
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
