name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # EAS Build installs with npm 10, which rejects lock files that npm 11 accepts (e.g. an
      # auto-installed peer outside another package's peer range). Catch that here, not on EAS.
      - name: Lock file installs with npm 10 (as on EAS)
        run: npx -y npm@10 ci --include=dev --ignore-scripts --dry-run
      - run: npm run typecheck
      - run: npm run lint
      # Version drift is skipped: Expo patch releases would otherwise turn main red (and block
      # Render's checksPass deploy) without any change here. Run `npx expo install --check` locally.
      - run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: Web build
        run: npx expo export --platform web

  # Android: publishes an OTA update to the `production` channel on every push to main. If the
  # native fingerprint changed (new native module, SDK upgrade, app.json native config), there is
  # no compatible APK yet, so it starts a new APK build too. Phones need that APK installed once.
  # The website is deployed by Render after these checks pass (render.yaml).
  deploy-android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    concurrency: deploy-android
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Skip (rather than fail) until EAS is set up; a red job would also block Render's
      # checksPass deploy of the website.
      - name: Check EAS is configured
        id: eas
        run: |
          echo "ready=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          [ "${{ secrets.EXPO_TOKEN != '' }}" = "true" ] || echo "::notice::EXPO_TOKEN secret not set; skipping Android deploy"
      - if: steps.eas.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.eas.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.eas.outputs.ready == 'true'
        run: npm ci
      - if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action@main
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          profile: production
          branch: production
          platform: android
          environment: production
